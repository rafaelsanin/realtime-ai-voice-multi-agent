# fly.toml app configuration file generated for livekit-prod-demo on 2026-08-27T18:40:19-05:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'livekit-prod-demo'
primary_region = 'iad'

[build]

# No [http_service] -- this is a single always-on worker holding one LiveKit
# room open, not a web service; it doesn't listen on a port.

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
